name: Mirror to Public
 
on:
  push:
    branches: [main]
 
jobs:
  mirror:
    name: Push to lockwood-framework/${{ github.event.repository.name }}
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
 
      - name: Push to public mirror
        env:
          TOKEN: ${{ secrets.LW_PUBLIC_PUSH_TOKEN }}
        run: |
          REPO="${GITHUB_REPOSITORY##*/}"
          git config --local --unset-all http.https://github.com/.extraheader || true
          git config --global credential.helper store
          git config --global user.email "cordrey.brandon@gmail.com"
          git config --global user.name "Morgrhim"
          echo "https://x-access-token:${TOKEN}@github.com" > ~/.git-credentials
          git rm -r --cached .github/ || true
          git commit -m "chore: remove internal github folder" || true
          git remote add public "https://github.com/Lockwood-Framework/${REPO}.git"
          git push public main --force